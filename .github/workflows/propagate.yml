name: Bioconductor Propagation Pipeline

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual triggering

jobs:
  propagate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for git operations
          
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            jsonlite
            yaml
            curl
            git2r
            logger
            biocUniTools
          
      - name: Run propagation pipeline
        run: |
          Rscript -e "
            source('R/utils.R')
            source('R/makeViews.R')
            source('R/updateViews.R')
            
            # Process devel branch
            message('Processing devel branch...')
            devel_result <- updatePackageViews('devel', 'devel')
            devel_views <- updateVIEWS('devel', 'devel/VIEWS.json', 'devel')
            
            # Process release branch
            message('Processing release branch...')
            release_result <- updatePackageViews('release', 'release')
            release_views <- updateVIEWS('release', 'release/VIEWS.json', 'release')
            
            # Print summary
            message('Devel: ', length(devel_result\[[1]]), ' updated, ', length(devel_result\[[2]]), ' new, ', length(devel_result\[[3]]), ' removed')
            message('Release: ', length(release_result\[[1]]), ' updated, ', length(release_result\[[2]]), ' new, ', length(release_result\[[3]]), ' removed')
          "
        
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          
          # Check if there are changes
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Update package views and VIEWS.json [AI-assisted]"
            git push
          else
            echo "No changes to commit"
          fi
